name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # NOTE: ubuntu-latest runners ship a full Android SDK already
      # (ANDROID_HOME is pre-set). The old android-actions/setup-android@v3
      # step was removed because it fails with "Failed to find package 'tools'"
      # (the obsolete `tools` package no longer exists in the SDK repo).
      - name: Prepare Android SDK (preinstalled on runner)
        run: |
          for d in "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/cmdline-tools/16.0/bin" /usr/local/lib/android/sdk/cmdline-tools/latest/bin /usr/local/lib/android/sdk/cmdline-tools/16.0/bin; do
            if [ -x "$d/sdkmanager" ]; then export PATH="$d:$PATH"; echo "sdkmanager found: $d"; break; fi
          done
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tagents-android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Tag pushes (v*) also produce a GitHub Release with the APK attached.
      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew assembleRelease --no-daemon

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
